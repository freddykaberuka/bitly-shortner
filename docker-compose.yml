services:
  db:
    image: postgres:13
    environment:
      POSTGRES_DB: shortner_url
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  auth-service:
    build: 
      context: ./auth-service
      dockerfile: ./Dockerfile
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/shortner_url"
    depends_on:
      - db

  url-shortener-service:
    build: 
      context: ./url-shortener-service
      dockerfile: ./Dockerfile
    ports:
      - "3002:3000/tcp" 
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/shortner_url"
    depends_on:
      - db

  api-gateway:
    build: 
      context: ./gateway
      dockerfile: ./Dockerfile
    ports:
      - "3003:3000"
    environment:
      JWT_SECRET: "SECRET"
    depends_on:
      - auth-service
      - url-shortener-service

volumes:
  postgres_data: